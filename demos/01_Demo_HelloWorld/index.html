<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>

</head>
<body>

    <div class="page-layout">

        <div class="container">

            <h1>Hello World</h1>
            <h4>Windows Instructions</h4>
            <p>
                Chrome/Edge:Try F12
            </p>
            <h4>MacOS Instructions</h4>
            <p>
                Chrome/Edge: Try Cmd + Option + I <br>
                Safari: Try Cmd + Option + C
            </p>

        </div>

    </div>

    <script>

        function sayHello() {

            var myName =  "Hannah";

            if (myName == "Josh") {

                // Josh Speaks
                console.log("Hello, World! My name is Josh.");

            } else if(myName == "Hannah") {

                // Hannah Speaks
                console.log("Hello, World! My name is Hannah.");

            } else {

                // Assign a default message.
                console.log("Hello, World!");

            }

            // Assign a message that always displays.
            console.log("The End.");

        }


        sayHello();


    </script>

</body>
</html>
